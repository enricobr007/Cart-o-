<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jose</title>

  <style>
    :root { color-scheme: light dark; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f4f4f4, #ffffff);
      color: #111;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 18px;
    }

    .card {
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 22px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 22px;
      opacity: .7;
      font-size: 15px;
    }

    .row {
      margin: 14px 0;
      padding: 12px;
      border-radius: 14px;
      background: #f7f7f7;
    }

    .label {
      opacity: .65;
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .masked {
      color: #111;
      font-weight: 500;
    }

    .btn {
      display: block;
      text-align: center;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .secondary {
      background: #f1f1f1;
      color: #111;
      border: 1px solid rgba(0,0,0,.1);
    }

    .small {
      opacity: .65;
      font-size: 12px;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="avatar">J</div>

      <h1>Jose</h1>
      <p class="subtitle">Digital Business Card</p>

      <div class="row">
        <span class="label">Phone</span>
        <span class="masked">+44 xxx2 571500</span>
      </div>

      <div class="row">
        <span class="label">Email</span>
        <span class="masked">xxxico.br@hotmail.com</span>
      </div>

      <div class="row">
        <span class="label">LinkedIn</span>
        <span class="masked">Not available</span>
      </div>

      <a class="btn" href="./jose.vcf">Save contact</a>

      <div class="small">Tap, scan, connect.</div>
    </div>
  </div>
</body>
</html>
